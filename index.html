<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Manuais - Tennis Place</title>
    
    <!-- Fonte moderna para combinar com a identidade -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de Cores da Identidade Tennis Place */
        :root {
            --tp-black: #000000;
            --tp-yellow: #FFD100;
            --tp-gray: #333333;
            --bg-color: #F4F4F5;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .login-logo {
            max-width: 180px;
            margin-bottom: 24px;
        }

        .login-title {
            color: var(--tp-black);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Container do Seletor de Perfil */
        .login-type-toggle {
            display: flex;
            background: #F1F5F9;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 25px;
            gap: 5px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #64748B;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .type-btn.active {
            background: var(--tp-yellow);
            color: var(--tp-black);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Estilos do Formulário */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--tp-gray);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--tp-black);
            box-shadow: 0 0 0 2px rgba(255, 209, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--tp-black);
            color: var(--tp-yellow);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #222222;
        }

        .error-msg {
            color: #DC2626;
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
            min-height: 20px;
        }
    [hidden] { display: none !important; }
        .portal-link { display:block; text-decoration:none; margin:12px 0; }
        .logout-btn { margin-top:16px; background:none; border:0; text-decoration:underline; cursor:pointer; padding:12px; }
        @media(max-width:480px) { .login-card { padding:28px 18px; } .type-btn { font-size:12px; padding:12px 6px; } .input-group input { font-size:16px; } }
    </style>
</head>

        <h1 class="login-title">Portal de Manuais</h1>
        <p class="login-subtitle">Selecione seu perfil para acessar o conteúdo</p>

        <!-- Botões de Separação de Usuário -->
        <div class="login-type-toggle" id="profile-toggle">
            <button type="button" class="type-btn active" id="btn-adm" onclick="setLoginType('adm')">Administrativo</button>
            <button type="button" class="type-btn" id="btn-loja" onclick="setLoginType('loja')">Lojas</button>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="user-login">Login</label>
                <input type="text" id="user-login" autocomplete="off" required>
            </div>
            
            <div class="input-group">
                <label for="user-password">Senha</label>
                <input type="password" id="user-password" required>
            </div>
            
            <button class="btn-submit" type="submit">Entrar no Portal</button>
            <div class="error-msg" id="login-error" role="alert"></div>
        </form>
        <section id="portal-selection" hidden aria-label="Portais disponíveis">
            <a class="btn-submit portal-link" id="link-loja" href="Portal_de_Manuais_da_Loja.html">Portal de Manuais da Loja</a>
            <a class="btn-submit portal-link" id="link-adm" href="Portal_de_Manuais_do_Administrativo.html" hidden>Portal de Manuais do Administrativo</a>
            <button type="button" class="logout-btn" id="logout">Sair</button>
        </section>
    </main>

    <script>
        const stores = Object.freeze({
            FLAM:'30083324000100', GRUU:'61542487000129', FORT:'32405901000150',
            CONT:'34401421000146', OUTB:'34481335000271', SALV:'05687261000145',
            ESBH:'50763761000173', DREY:'50763761000335', BURI:'21623097000169',
            PASS:'22579087000136', UBER:'07441743000146', GOIS:'34893113000185',
            CIDA:'55507194000108', PSUL:'66463943000169', CRDO:'66463943000240',
            APAR:'66463943000320', IPAT:'61601205000117', JOIN:'28129538000381',
            ARAS:'50354235000150', GVAL:'61529650000113', CVAL:'61601205000206',
            JUIZ:'34756204000179', ITAU:'29398691000105'
        });
        const sessionKey = 'tp-manuais-session-v1';
        let currentLoginType = 'adm';
        const el = id => document.getElementById(id);
        function setLoginType(type) {
            currentLoginType = type;
            ['adm','loja'].forEach(profile => {
                el('btn-'+profile).classList.toggle('active', profile === type);
                el('btn-'+profile).setAttribute('aria-pressed', String(profile === type));
            });
            el('login-form').reset();
            el('login-error').textContent = '';
            if (type === 'loja') el('user-password').setAttribute('maxlength','14');
            else el('user-password').removeAttribute('maxlength');
        }
        function validSession(session) {
            return session && ((session.role === 'adm' && session.login === 'ADM') ||
                (session.role === 'loja' && Object.prototype.hasOwnProperty.call(stores, session.login)));
        }
        function showPortals(session) {
            el('login-form').hidden = true;
            el('profile-toggle').hidden = true;
            el('portal-selection').hidden = false;
            el('link-adm').hidden = session.role !== 'adm';
            document.querySelector('.login-subtitle').textContent = 'Selecione o portal que deseja acessar';
            el('user-password').value = '';
        }
        el('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const login = el('user-login').value.trim().toUpperCase();
            const password = el('user-password').value;
            const accepted = currentLoginType === 'adm'
                ? login === 'ADM' && password === 'Tennis@TP'
                : Object.prototype.hasOwnProperty.call(stores, login) && stores[login] === password;
            if (!accepted) {
                el('login-error').textContent = 'Login ou senha inválidos.';
                return;
            }
            const session = { role: currentLoginType, login };
            try { sessionStorage.setItem(sessionKey, JSON.stringify(session)); } catch (_) {}
            showPortals(session);
            el('link-loja').focus();
        });
        el('logout').addEventListener('click', function() {
            try { sessionStorage.removeItem(sessionKey); } catch (_) {}
            el('portal-selection').hidden = true;
            el('link-adm').hidden = true;
            el('login-form').hidden = false;
            el('profile-toggle').hidden = false;
            document.querySelector('.login-subtitle').textContent = 'Selecione seu perfil para acessar o conteúdo';
            setLoginType('adm');
            el('user-login').focus();
        });
        setLoginType('adm');
        try {
            const saved = JSON.parse(sessionStorage.getItem(sessionKey));
            if (validSession(saved)) showPortals(saved);
        } catch (_) {}
    </script>
</body>
